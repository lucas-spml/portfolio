    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const translations = {
                en: {
                    "hero.name": "Page in development… 👨🏻‍💻",
                    "content.overview":
                        "This project is still being documented. I’m organizing the story (problem, goals, solutions, and outcomes) to publish a complete case study soon."
                },
                pt: {
                    "hero.name": "Página em desenvolvimento...👨🏻‍💻",
                    "content.overview":
                        "Este projeto ainda está sendo documentado. Estou organizando o processo (problema, objetivos, soluções e resultados) para publicar um case completo em breve."
                }
            };

            let currentLang = localStorage.getItem("site-lang") || "en";

            const pill = document.querySelector(".lang-pill");
            const options = document.querySelectorAll(".lang-option");

            function setPill(lang) {
                pill.textContent = lang === "pt" ? "BR" : "EN";
            }

            function translatePage(lang) {
                document.querySelectorAll("[data-i18n]").forEach(el => {
                    const key = el.getAttribute("data-i18n");
                    const txt = translations[lang]?.[key];
                    if (txt) el.innerHTML = txt; // permite <strong> e <br>, se usar no futuro
                });

                localStorage.setItem("site-lang", lang);
                currentLang = lang;
                setPill(lang);
            }

            translatePage(currentLang);

            options.forEach(btn => {
                btn.addEventListener("click", () => {
                    translatePage(btn.getAttribute("data-lang"));
                });
            });
        });
    </script>


    <script>
        //============== isotope masonry js with imagesloaded
        imagesLoaded('#container', function () {
            var elem = document.querySelector('.grid');
            var iso = new Isotope(elem, {
